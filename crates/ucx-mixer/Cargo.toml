[package]
name = "ucx-mixer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The Fireface UCX's mixer as TotalMix models it: strips, submixes, and the register words that set them"
publish = false

[dependencies]
ucx-protocol = { path = "../ucx-protocol" }
# the mixer's state, saved between runs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
