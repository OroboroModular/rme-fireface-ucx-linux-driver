[package]
name = "oroboro_egui"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The Oroboro family look (PLUGIN_GUIDE.md Part 1) in egui: palette, font, knob, toggle, step picker, buttons, sections, overlay cards."

[dependencies]
# egui, as Truce's editor host has it (truce-egui)
egui = "0.34"
# Theme files (JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
