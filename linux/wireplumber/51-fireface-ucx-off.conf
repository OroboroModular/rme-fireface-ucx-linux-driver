# WirePlumber rule that leaves the snd-fireface-ucx card out of PipeWire altogether, for testing
# it through ALSA alone (linux/alsa_check.py) with nothing routed to it. Install it the same way
# as 51-fireface-ucx.conf, and remove it (and restart WirePlumber) to use the card in PipeWire.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "Fireface UCX" }
      { device.name = "~alsa_card\\.usb-RME_Fireface_UCX.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
