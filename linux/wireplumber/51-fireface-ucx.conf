# WirePlumber rule for the snd-fireface-ucx card: its nodes never become the default device by
# themselves (a USB card otherwise usually does), as ucx-stream's nodes don't. Pick them in the
# sound settings or route applications to them. Install:
#     cp linux/wireplumber/51-fireface-ucx.conf ~/.config/wireplumber/wireplumber.conf.d/
#     systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "Fireface UCX" }
      { node.name = "~alsa_(input|output)\\.usb-RME_Fireface_UCX.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
