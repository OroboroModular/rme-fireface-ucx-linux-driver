# DKMS rebuilds the module for every installed kernel (linux/DRIVER_PLAN.md, "Kernel driver"):
#     sudo dkms install linux/kernel
PACKAGE_NAME="snd-fireface-ucx"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="snd-fireface-ucx"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make clean"
AUTOINSTALL="yes"
